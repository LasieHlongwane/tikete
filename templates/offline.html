<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="theme-color"
        content="#0b0c0e"
    >

    <title>
        Offline | Kalxa 
    </title>

    <link
        rel="manifest"
        href="{{ url_for(
            'pwa_manifest'
        ) }}"
    >

    <link
        rel="apple-touch-icon"
        href="{{ url_for(
            'static',
            filename='icons/kalxa-192.png'
        ) }}"
    >

    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: grid;

            place-items: center;

            padding: 24px;

            background: #0b0c0e;

            color: #ffffff;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }


        .card {

            width:
                min(
                    440px,
                    100%
                );

            padding: 28px;

            background: #18181b;

            border:
                1px solid #27272a;

            border-radius: 22px;

            text-align: center;
        }


        .mark {

            width: 64px;

            height: 64px;

            display: grid;

            place-items: center;

            margin: 0 auto 18px;

            background: #fff4df;

            color: #0b0c0e;

            border-radius: 18px;

            font-size: 30px;

            font-weight: 900;
        }


        h1 {

            margin: 0 0 8px;

            font-size: 28px;
        }


        p {

            margin: 0 0 20px;

            color: #cbd5e1;

            line-height: 1.6;
        }


        button {

            padding: 11px 16px;

            background: #fff4df;

            color: #0b0c0e;

            border: 0;

            border-radius: 10px;

            font-weight: 850;

            cursor: pointer;
        }

    </style>

</head>


<body>

    <main class="card">

        <div class="mark">
            K
        </div>

        <h1>
            You’re offline
        </h1>

        <p>
            Kalxa needs an internet connection
            to load current event, ticket and payment information.
        </p>

        <button
            type="button"
            onclick="window.location.reload()"
        >
            Try Again
        </button>

    </main>

</body>

</html>
